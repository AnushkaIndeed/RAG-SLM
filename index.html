<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SLM Multi-Agent Pipeline</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
  textarea { width: 100%; height: 80px; padding: 10px; font-size: 15px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
  #answer { white-space: pre-wrap; background: #f5f5f5; padding: 15px; border-radius: 6px; margin-top: 20px; }
  details { margin-top: 15px; }
  summary { cursor: pointer; font-weight: bold; }
  #debug { white-space: pre-wrap; font-family: monospace; font-size: 13px; background: #fafafa; padding: 10px; border: 1px solid #ddd; }
  .loading { color: #888; }
</style>
</head>
<body>

<h2>SLM Multi-Agent Pipeline</h2>

<textarea id="queryInput" placeholder="Ask a question..."></textarea>
<br>
<textarea id="contextInput" placeholder="(Optional) paste context text here directly"></textarea>
<br>
<button onclick="runQuery()">Run Query</button>

<div id="answer"></div>

<details>
  <summary>Debug trace (planner steps + routing decisions)</summary>
  <div id="debug"></div>
</details>

<script>
const API_URL = "http://127.0.0.1:8000";

async function runQuery() {
  const query = document.getElementById("queryInput").value;
  const context = document.getElementById("contextInput").value;
  const answerDiv = document.getElementById("answer");
  const debugDiv = document.getElementById("debug");

  if (!query.trim()) {
    answerDiv.textContent = "Please enter a query.";
    return;
  }

  answerDiv.innerHTML = '<span class="loading">Running pipeline...</span>';
  debugDiv.textContent = "";

  try {
    const response = await fetch(`${API_URL}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: query, context: context }),
    });

    if (!response.ok) {
      answerDiv.textContent = `Error: ${response.status} ${response.statusText}`;
      return;
    }

    const data = await response.json();
    answerDiv.textContent = data.final_answer;
    debugDiv.textContent = data.task_log.join("\n");
  } catch (err) {
    answerDiv.textContent = `Failed to reach API: ${err.message}\n\nMake sure the backend is running: uvicorn api:app --reload`;
  }
}
</script>

</body>
</html>
